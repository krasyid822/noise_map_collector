name: Build and Release APK

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APKs (ARM 32-bit & 64-bit)
        run: |
          flutter build apk --split-per-abi --release
          
          # Rename the split APK files for clarity
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/noise_map_collector-arm64.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/noise_map_collector-arm32.apk

      - name: Generate Version Tag
        id: tag
        run: echo "tag_name=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          body: |
            Automated Release for Noise Map Collector.
            
            **Artifacts:**
            * `noise_map_collector-arm64.apk` (ARM 64-bit / arm64-v8a)
            * `noise_map_collector-arm32.apk` (ARM 32-bit / armeabi-v7a)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/noise_map_collector-arm64.apk
            build/app/outputs/flutter-apk/noise_map_collector-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
